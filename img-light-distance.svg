<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img"
     aria-labelledby="ldt ldd" width="1000" height="500">
  <title id="ldt">The same grow light at two heights above a microgreen tray</title>
  <desc id="ldd">Two side by side scenes. On the left the light sits far above the tray, its beam spreading thin and the seedlings growing tall, pale and floppy. On the right the same light sits roughly a hand's width above the canopy, its beam concentrated, and the seedlings are short, sturdy and evenly coloured.</desc>

  <!-- too far -->
  <rect x="120" y="52" width="260" height="20" rx="3" fill="#1F3A2B" stroke="#17211B" stroke-width="2.4"/>
  <path d="M 130 74 L 40 392 L 460 392 L 370 74 Z" fill="#3D6249" fill-opacity="0.07"/>
  <g stroke="#3D6249" stroke-width="1.2" stroke-dasharray="6 9">
    <path d="M 160 76 L 90 390"/><path d="M 215 76 L 180 390"/>
    <path d="M 285 76 L 320 390"/><path d="M 340 76 L 410 390"/>
  </g>
  <g fill="none" stroke="#3D6249" stroke-width="2" stroke-linecap="round">
    <path d="M 110 392 C 108 340 118 300 106 262"/>
    <path d="M 165 392 C 168 336 156 294 172 254"/>
    <path d="M 220 392 C 216 344 228 296 212 250"/>
    <path d="M 275 392 C 278 340 266 300 284 258"/>
    <path d="M 330 392 C 326 348 338 302 320 264"/>
    <path d="M 385 392 C 388 342 376 300 394 268"/>
  </g>
  <g fill="#3D6249" fill-opacity="0.18" stroke="#3D6249" stroke-width="1.4">
    <ellipse cx="106" cy="256" rx="16" ry="7"/><ellipse cx="172" cy="248" rx="16" ry="7"/>
    <ellipse cx="212" cy="244" rx="16" ry="7"/><ellipse cx="284" cy="252" rx="16" ry="7"/>
    <ellipse cx="320" cy="258" rx="16" ry="7"/><ellipse cx="394" cy="262" rx="16" ry="7"/>
  </g>

  <!-- correct distance -->
  <rect x="620" y="248" width="260" height="20" rx="3" fill="#1F3A2B" stroke="#17211B" stroke-width="2.4"/>
  <path d="M 626 270 L 596 392 L 904 392 L 874 270 Z" fill="#9E4A2E" fill-opacity="0.10"/>
  <g stroke="#9E4A2E" stroke-width="1.2" stroke-dasharray="6 7">
    <path d="M 660 272 L 646 390"/><path d="M 715 272 L 708 390"/>
    <path d="M 785 272 L 792 390"/><path d="M 840 272 L 854 390"/>
  </g>
  <g fill="none" stroke="#3D6249" stroke-width="3" stroke-linecap="round">
    <path d="M 620 392 L 620 344"/><path d="M 665 392 L 665 340"/>
    <path d="M 710 392 L 710 346"/><path d="M 755 392 L 755 338"/>
    <path d="M 800 392 L 800 344"/><path d="M 845 392 L 845 340"/>
    <path d="M 890 392 L 890 346"/>
  </g>
  <g fill="#3D6249" fill-opacity="0.24" stroke="#3D6249" stroke-width="1.6">
    <ellipse cx="620" cy="338" rx="19" ry="9"/><ellipse cx="665" cy="334" rx="19" ry="9"/>
    <ellipse cx="710" cy="340" rx="19" ry="9"/><ellipse cx="755" cy="332" rx="19" ry="9"/>
    <ellipse cx="800" cy="338" rx="19" ry="9"/><ellipse cx="845" cy="334" rx="19" ry="9"/>
    <ellipse cx="890" cy="340" rx="19" ry="9"/>
  </g>

  <!-- trays -->
  <g fill="none" stroke="#17211B" stroke-width="3">
    <path d="M 60 392 L 440 392 L 428 428 L 72 428 Z"/>
    <path d="M 596 392 L 916 392 L 904 428 L 608 428 Z"/>
  </g>

  <!-- distance markers -->
  <g stroke="#9E4A2E" stroke-width="1.6" fill="none">
    <path d="M 486 74 L 486 388 M 480 84 L 486 74 L 492 84 M 480 378 L 486 388 L 492 378"/>
    <path d="M 946 270 L 946 388 M 940 280 L 946 270 L 952 280 M 940 378 L 946 388 L 952 378"/>
  </g>

  <g font-family="IBM Plex Mono, ui-monospace, monospace" text-anchor="middle">
    <g font-size="18" fill="#17211B" letter-spacing="1.3">
      <text x="250" y="34">TOO FAR</text><text x="750" y="34">A HAND'S WIDTH</text>
    </g>
    <g font-size="15" fill="#9E4A2E">
      <text x="250" y="470">Tall, pale, floppy</text>
      <text x="750" y="470">Short, sturdy, even</text>
    </g>
    <g font-size="13" fill="#3D6249">
      <text x="250" y="492">Beam spread thin over the tray</text>
      <text x="750" y="492">Raise the bar as the crop grows</text>
    </g>
  </g>
</svg>
