<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img"
     aria-labelledby="pwt pwd" width="980" height="560">
  <title id="pwt">Concentration ratio and the make or buy decision for food powders</title>
  <desc id="pwd">On the left, a large pile of fresh produce reduces through drying and grinding to a small jar of powder, showing roughly a ten to one ratio by weight. On the right, a decision split: plants you can buy fresh and dry are worth making at home, while anything needing fermentation, extraction, shade growing or a tropical climate is worth buying.</desc>

  <!-- concentration -->
  <g>
    <path d="M 70 300 C 90 210 190 210 210 300 Z" fill="#3D6249" fill-opacity="0.26"
          stroke="#3D6249" stroke-width="2.4"/>
    <path d="M 70 300 L 210 300" stroke="#17211B" stroke-width="2.6"/>
    <g fill="none" stroke="#3D6249" stroke-width="1.6">
      <circle cx="112" cy="268" r="13"/><circle cx="146" cy="252" r="15"/>
      <circle cx="178" cy="272" r="12"/><circle cx="130" cy="288" r="11"/>
      <circle cx="164" cy="290" r="12"/>
    </g>

    <g stroke="#9E4A2E" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M 236 262 L 300 262 M 288 254 L 300 262 L 288 270"/>
    </g>
    <text x="268" y="242" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13"
          fill="#9E4A2E" text-anchor="middle">dry</text>

    <path d="M 322 232 L 402 232 L 402 292 L 322 292 Z" fill="none" stroke="#17211B" stroke-width="2.6"/>
    <g stroke="#3D6249" stroke-width="1.8">
      <path d="M 332 246 L 392 246"/><path d="M 332 262 L 392 262"/><path d="M 332 278 L 392 278"/>
    </g>

    <g stroke="#9E4A2E" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M 424 262 L 488 262 M 476 254 L 488 262 L 476 270"/>
    </g>
    <text x="456" y="242" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13"
          fill="#9E4A2E" text-anchor="middle">grind</text>

    <path d="M 508 236 L 508 296 Q 508 306 518 306 L 556 306 Q 566 306 566 296 L 566 236 Z"
          fill="#9E4A2E" fill-opacity="0.22" stroke="#17211B" stroke-width="2.6"/>
    <rect x="502" y="226" width="70" height="12" rx="2" fill="#1F3A2B" stroke="#17211B" stroke-width="2.2"/>
  </g>

  <g font-family="IBM Plex Mono, ui-monospace, monospace" text-anchor="middle">
    <text x="140" y="180" font-size="17" fill="#17211B" letter-spacing="1">1 KG FRESH</text>
    <text x="537" y="180" font-size="17" fill="#9E4A2E" letter-spacing="1">100 G POWDER</text>
    <text x="140" y="340" font-size="13" fill="#3D6249">mushrooms, tomatoes, onion</text>
    <text x="537" y="340" font-size="13" fill="#3D6249">roughly ten to one</text>
    <text x="362" y="368" font-size="14" fill="#17211B">Nothing is added. Water and structure are removed.</text>
  </g>

  <path d="M 60 404 L 920 404" stroke="#3D6249" stroke-width="1.2"/>

  <!-- make or buy -->
  <g font-family="IBM Plex Mono, ui-monospace, monospace">
    <text x="270" y="446" font-size="18" fill="#3D6249" text-anchor="middle" letter-spacing="1">MAKE IT</text>
    <text x="710" y="446" font-size="18" fill="#9E4A2E" text-anchor="middle" letter-spacing="1">BUY IT</text>
    <g font-size="14" fill="#17211B" text-anchor="middle">
      <text x="270" y="474">You can buy it fresh and dry it</text>
      <text x="710" y="474">It needs more than drying</text>
    </g>
    <g font-size="13" fill="#3D6249" text-anchor="middle">
      <text x="270" y="502">mushroom &#183; tomato &#183; onion &#183; garlic</text>
      <text x="270" y="522">kale &#183; beetroot &#183; pepper &#183; citrus zest</text>
      <text x="710" y="502">cacao &#183; matcha &#183; spirulina</text>
      <text x="710" y="522">chlorella &#183; baobab</text>
    </g>
  </g>
  <path d="M 490 426 L 490 540" stroke="#3D6249" stroke-width="1.2" stroke-dasharray="6 6"/>
</svg>
