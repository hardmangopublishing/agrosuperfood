<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img"
     aria-labelledby="dvt dvd" width="1000" height="560">
  <title id="dvt">The four variables that govern a drying batch</title>
  <desc id="dvd">Four panels. Uniform slice thickness shown as even slices beside uneven ones. Temperature shown as a correct low setting against a hot setting causing a hardened surface shell. Airflow shown as air moving between spaced pieces against a crowded tray. Load shown as a single layer against a stacked one.</desc>

  <g stroke="#3D6249" stroke-width="1.2">
    <path d="M 500 60 L 500 500"/><path d="M 60 280 L 940 280"/>
  </g>

  <!-- 1 thickness -->
  <g>
    <g fill="none" stroke="#17211B" stroke-width="2.6">
      <rect x="110" y="150" width="14" height="70"/><rect x="134" y="150" width="14" height="70"/>
      <rect x="158" y="150" width="14" height="70"/><rect x="182" y="150" width="14" height="70"/>
    </g>
    <g fill="none" stroke="#9E4A2E" stroke-width="2.6">
      <rect x="300" y="150" width="8" height="70"/><rect x="316" y="150" width="26" height="70"/>
      <rect x="350" y="150" width="12" height="70"/><rect x="370" y="150" width="20" height="70"/>
    </g>
    <path d="M 240 185 L 268 185" stroke="#3D6249" stroke-width="1.4" stroke-dasharray="4 4"/>
  </g>

  <!-- 2 temperature -->
  <g>
    <ellipse cx="620" cy="185" rx="52" ry="34" fill="#3D6249" fill-opacity="0.20"
             stroke="#17211B" stroke-width="2.6"/>
    <ellipse cx="838" cy="185" rx="52" ry="34" fill="#3D6249" fill-opacity="0.10"
             stroke="#17211B" stroke-width="2.6"/>
    <ellipse cx="838" cy="185" rx="52" ry="34" fill="none" stroke="#9E4A2E" stroke-width="5"/>
    <ellipse cx="838" cy="185" rx="30" ry="18" fill="#9E4A2E" fill-opacity="0.30" stroke="none"/>
    <g stroke="#9E4A2E" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M 806 128 C 812 118 802 112 808 102"/>
      <path d="M 838 124 C 844 114 834 108 840 98"/>
      <path d="M 870 128 C 876 118 866 112 872 102"/>
    </g>
  </g>

  <!-- 3 airflow -->
  <g>
    <path d="M 90 420 L 220 420" stroke="#17211B" stroke-width="3"/>
    <g fill="#3D6249" fill-opacity="0.26" stroke="#3D6249" stroke-width="1.8">
      <ellipse cx="110" cy="410" rx="14" ry="8"/><ellipse cx="155" cy="410" rx="14" ry="8"/>
      <ellipse cx="200" cy="410" rx="14" ry="8"/>
    </g>
    <g stroke="#9E4A2E" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M 118 388 L 148 388 M 140 382 L 148 388 L 140 394"/>
      <path d="M 163 388 L 193 388 M 185 382 L 193 388 L 185 394"/>
    </g>
    <path d="M 280 420 L 410 420" stroke="#17211B" stroke-width="3"/>
    <g fill="#3D6249" fill-opacity="0.40" stroke="#3D6249" stroke-width="1.8">
      <ellipse cx="298" cy="410" rx="14" ry="8"/><ellipse cx="324" cy="410" rx="14" ry="8"/>
      <ellipse cx="350" cy="410" rx="14" ry="8"/><ellipse cx="376" cy="410" rx="14" ry="8"/>
      <ellipse cx="400" cy="410" rx="14" ry="8"/>
    </g>
    <path d="M 330 382 L 360 382 M 360 376 L 330 388" stroke="#9E4A2E" stroke-width="2.4"/>
  </g>

  <!-- 4 load -->
  <g>
    <g fill="none" stroke="#17211B" stroke-width="3">
      <path d="M 560 424 L 690 424"/>
    </g>
    <g fill="#3D6249" fill-opacity="0.26" stroke="#3D6249" stroke-width="1.8">
      <ellipse cx="580" cy="414" rx="15" ry="8"/><ellipse cx="625" cy="414" rx="15" ry="8"/>
      <ellipse cx="670" cy="414" rx="15" ry="8"/>
    </g>
    <g fill="none" stroke="#17211B" stroke-width="3">
      <path d="M 770 424 L 900 424"/>
    </g>
    <g fill="#9E4A2E" fill-opacity="0.22" stroke="#9E4A2E" stroke-width="1.8">
      <ellipse cx="790" cy="414" rx="15" ry="8"/><ellipse cx="835" cy="414" rx="15" ry="8"/>
      <ellipse cx="880" cy="414" rx="15" ry="8"/>
      <ellipse cx="812" cy="398" rx="15" ry="8"/><ellipse cx="857" cy="398" rx="15" ry="8"/>
      <ellipse cx="835" cy="382" rx="15" ry="8"/>
    </g>
  </g>

  <g font-family="IBM Plex Mono, ui-monospace, monospace" text-anchor="middle">
    <g font-size="18" fill="#17211B" letter-spacing="1">
      <text x="250" y="100">1 &#183; THICKNESS</text>
      <text x="730" y="100">2 &#183; TEMPERATURE</text>
      <text x="250" y="330">3 &#183; AIRFLOW</text>
      <text x="730" y="330">4 &#183; LOAD</text>
    </g>
    <g font-size="14" fill="#3D6249">
      <text x="250" y="124">uniform beats thin</text>
      <text x="730" y="124">low and slow, or the surface seals</text>
      <text x="250" y="354">gaps let moisture leave</text>
      <text x="730" y="354">one layer dries evenly</text>
    </g>
    <g font-size="13" fill="#17211B">
      <text x="153" y="248">even</text><text x="345" y="248">uneven</text>
      <text x="620" y="248">57 C</text><text x="838" y="248">too hot</text>
      <text x="155" y="454">spaced</text><text x="345" y="454">crowded</text>
      <text x="625" y="454">single layer</text><text x="835" y="454">stacked</text>
    </g>
    <g font-size="13" fill="#9E4A2E">
      <text x="345" y="270">thickest piece sets the time</text>
      <text x="838" y="270">case hardening</text>
      <text x="345" y="476">air saturates and stalls</text>
      <text x="835" y="476">damp pieces hide inside</text>
    </g>
  </g>
</svg>
