<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img"
     aria-labelledby="lht lhd" width="900" height="460">
  <title id="lht">Whole, split, and hulled lentils compared in edge view and face view</title>
  <desc id="lhd">Three lentils shown from the edge and from the face. The whole lentil is a complete lens shape with an intact coat and a visible embryo, and it will sprout. The split lentil has one flat face where the seed was cut in two. The hulled and split lentil has neither coat nor embryo. Neither of the last two will ever germinate.</desc>

  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#3D6249"
     text-anchor="end" letter-spacing="0.08em">
    <text x="76" y="146">EDGE VIEW</text>
    <text x="76" y="300">FACE VIEW</text>
  </g>
  <path d="M 92 100 L 92 340" stroke="#3D6249" stroke-width="1"/>

  <!-- whole lentil -->
  <g>
    <ellipse cx="230" cy="140" rx="66" ry="28" fill="none" stroke="#17211B" stroke-width="3"/>
    <path d="M 164 140 L 296 140" stroke="#3D6249" stroke-width="1.4" stroke-dasharray="5 5"/>
    <path d="M 296 140 C 308 133 316 140 306 149" fill="#9E4A2E" stroke="#9E4A2E" stroke-width="2"/>
    <circle cx="230" cy="296" r="60" fill="none" stroke="#17211B" stroke-width="3"/>
    <circle cx="230" cy="296" r="50" fill="none" stroke="#3D6249" stroke-width="1.4"/>
    <path d="M 290 296 C 302 289 310 296 300 305" fill="#9E4A2E" stroke="#9E4A2E" stroke-width="2"/>
  </g>

  <!-- split lentil -->
  <g>
    <path d="M 386 128 L 514 128 Q 450 182 386 128 Z" fill="none" stroke="#17211B" stroke-width="3"/>
    <path d="M 386 128 L 514 128" stroke="#9E4A2E" stroke-width="4"/>
    <path d="M 390 296 A 60 60 0 0 1 510 296 Z" fill="none" stroke="#17211B" stroke-width="3"/>
    <path d="M 390 296 L 510 296" stroke="#9E4A2E" stroke-width="4"/>
    <path d="M 398 286 A 50 50 0 0 1 502 286" fill="none" stroke="#3D6249" stroke-width="1.4"/>
  </g>

  <!-- hulled and split -->
  <g>
    <path d="M 656 128 L 784 128 Q 720 182 656 128 Z" fill="#9E4A2E" fill-opacity="0.14"
          stroke="#17211B" stroke-width="2" stroke-dasharray="7 5"/>
    <path d="M 656 128 L 784 128" stroke="#9E4A2E" stroke-width="4"/>
    <path d="M 660 296 A 60 60 0 0 1 780 296 Z" fill="#9E4A2E" fill-opacity="0.14"
          stroke="#17211B" stroke-width="2" stroke-dasharray="7 5"/>
    <path d="M 660 296 L 780 296" stroke="#9E4A2E" stroke-width="4"/>
  </g>

  <!-- verdicts -->
  <g stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 206 384 L 224 402 L 258 366" stroke="#3D6249"/>
    <path d="M 428 368 L 472 400 M 472 368 L 428 400" stroke="#9E4A2E"/>
    <path d="M 698 368 L 742 400 M 742 368 L 698 400" stroke="#9E4A2E"/>
  </g>

  <g font-family="IBM Plex Mono, ui-monospace, monospace" text-anchor="middle">
    <g font-size="17" fill="#17211B" letter-spacing="1.2">
      <text x="230" y="436">WHOLE</text>
      <text x="450" y="436">SPLIT</text>
      <text x="720" y="436">SPLIT AND HULLED</text>
    </g>
    <g font-size="13" fill="#3D6249">
      <text x="230" y="60">coat intact, embryo intact</text>
      <text x="450" y="60">one flat face, embryo cut</text>
      <text x="720" y="60">no coat, no embryo</text>
    </g>
  </g>
</svg>
