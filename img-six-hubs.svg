  <path d="M 120 152 C 106 142 96 148 96 160 C 106 166 116 160 120 152 Z"
        fill="#3D6249" fill-opacity="0.3" stroke="#3D6249" stroke-width="2"/>
  <path d="M 120 152 C 134 142 144 148 144 160 C 134 166 124 160 120 152 Z"
        fill="#3D6249" fill-opacity="0.3" stroke="#3D6249" stroke-width="2"/>

