<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 380" role="img"
     aria-labelledby="shT shD" width="1180" height="380">
  <title id="shT">The six subjects covered on this site, drawn as a single line of vessels</title>
  <desc id="shD">Six drawings in a row: a sprouting jar with a shoot, a glass of juice, a drying tray of sliced fruit, a fermenting jar with an airlock, a jar of powder with a spoon, and a mill with wheat. Terracotta marks what is alive or changing; deep green marks the vessels.</desc>

  <path d="M 40 268 L 1140 268" stroke="#3D6249" stroke-width="1.2"/>

