  <g fill="none" stroke="#17211B" stroke-width="2.8" stroke-linejoin="round">
    <path d="M 428 224 L 592 224 L 578 268 L 442 268 Z"/>
    <path d="M 428 178 L 592 178 L 578 222 L 442 222 Z"/>
