<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img"
     aria-labelledby="svt svd" width="880" height="500">
  <title id="svt">The twenty seed germination test after seventy two hours</title>
  <desc id="svd">Twenty seeds laid out in a grid on a damp paper towel. Sixteen have opened and put out a root; four remain closed. The result reads sixteen of twenty, or eighty percent, and a scale below shows the thresholds: above eighty use normally, seventy to eighty expect duds, below seventy use the seed for cooking instead.</desc>

  <!-- damp towel -->
  <rect x="60" y="60" width="500" height="300" rx="4" fill="#E4D9C2"
        stroke="#3D6249" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="310" y="46" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14"
        fill="#3D6249" text-anchor="middle" letter-spacing="0.08em">DAMP PAPER TOWEL, SEALED, 72 HOURS</text>

  <!-- sprouted seeds -->
  <g>
    <g fill="none" stroke="#17211B" stroke-width="2.4">
      <circle cx="150" cy="130" r="20"/><circle cx="250" cy="130" r="20"/>
      <circle cx="350" cy="130" r="20"/><circle cx="450" cy="130" r="20"/>
      <circle cx="150" cy="210" r="20"/><circle cx="250" cy="210" r="20"/>
      <circle cx="450" cy="210" r="20"/>
      <circle cx="150" cy="290" r="20"/><circle cx="350" cy="290" r="20"/>
      <circle cx="450" cy="290" r="20"/>
    </g>
    <g stroke="#9E4A2E" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M 168 138 C 182 148 190 160 186 172"/>
      <path d="M 268 138 C 282 148 290 160 286 172"/>
      <path d="M 368 138 C 382 148 390 160 386 172"/>
      <path d="M 468 138 C 482 148 490 160 486 172"/>
      <path d="M 168 218 C 182 228 190 240 186 252"/>
      <path d="M 268 218 C 282 228 290 240 286 252"/>
      <path d="M 468 218 C 482 228 490 240 486 252"/>
      <path d="M 168 298 C 182 308 190 320 186 332"/>
      <path d="M 368 298 C 382 308 390 320 386 332"/>
      <path d="M 468 298 C 482 308 490 320 486 332"/>
    </g>
  </g>

  <!-- more sprouted, second cluster -->
  <g fill="none" stroke="#17211B" stroke-width="2.4">
    <circle cx="100" cy="170" r="20"/><circle cx="300" cy="170" r="20"/>
    <circle cx="400" cy="170" r="20"/><circle cx="500" cy="170" r="20"/>
    <circle cx="200" cy="250" r="20"/><circle cx="400" cy="250" r="20"/>
  </g>
  <g stroke="#9E4A2E" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 118 178 C 132 188 140 200 136 212"/>
    <path d="M 318 178 C 332 188 340 200 336 212"/>
    <path d="M 418 178 C 432 188 440 200 436 212"/>
    <path d="M 518 178 C 532 188 540 200 536 212"/>
    <path d="M 218 258 C 232 268 240 280 236 292"/>
    <path d="M 418 258 C 432 268 440 280 436 292"/>
  </g>

  <!-- duds -->
  <g fill="#7E9C85" fill-opacity="0.30" stroke="#7E9C85" stroke-width="2.4">
    <circle cx="350" cy="210" r="20"/><circle cx="200" cy="170" r="20"/>
    <circle cx="300" cy="250" r="20"/><circle cx="250" cy="290" r="20"/>
  </g>

  <!-- readout -->
  <g font-family="IBM Plex Mono, ui-monospace, monospace">
    <text x="620" y="128" font-size="46" fill="#17211B" letter-spacing="1">16 / 20</text>
    <text x="620" y="166" font-size="30" fill="#9E4A2E">80%</text>
    <text x="620" y="200" font-size="13" fill="#3D6249">count the opened seeds,</text>
    <text x="620" y="218" font-size="13" fill="#3D6249">multiply by five</text>
  </g>

  <!-- threshold scale -->
  <g>
    <rect x="60" y="404" width="240" height="26" fill="#9E4A2E" fill-opacity="0.30"/>
    <rect x="300" y="404" width="120" height="26" fill="#9E4A2E" fill-opacity="0.16"/>
    <rect x="420" y="404" width="400" height="26" fill="#3D6249" fill-opacity="0.22"/>
    <rect x="60" y="404" width="760" height="26" fill="none" stroke="#17211B" stroke-width="2"/>
    <path d="M 668 396 L 668 438" stroke="#17211B" stroke-width="3"/>
  </g>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" text-anchor="middle">
    <text x="180" y="392" fill="#9E4A2E">BELOW 70%</text>
    <text x="360" y="392" fill="#9E4A2E">70 TO 80%</text>
    <text x="620" y="392" fill="#3D6249">ABOVE 80%</text>
    <text x="180" y="452" fill="#17211B">cook it, do not sprout it</text>
    <text x="360" y="452" fill="#17211B">expect duds</text>
    <text x="620" y="452" fill="#17211B">use normally</text>
    <text x="668" y="478" fill="#17211B">this batch</text>
  </g>
</svg>
